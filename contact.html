<main id="main"><section style="padding-top:9rem"><div class="wrap">
<span class="label">Contact</span><h1 style="font-size:var(--t-h2)">Tell us about your project.</h1>
<p class="mute">Share a few details about your company and website. We will reply with next steps.</p>
<div id="form-status" class="status" role="status" tabindex="-1" hidden></div>
<form id="inquiry" novalidate style="margin-top:2rem">
<div class="fr"><div><label for="name">Name</label><input id="name" name="name" autocomplete="name" required><div class="err" id="name-err"></div></div>
<div><label for="company">Company</label><input id="company" name="company" autocomplete="organization" required><div class="err" id="company-err"></div></div></div>
<div class="fr"><div><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><div class="err" id="email-err"></div></div>
<div><label for="phone">Phone (optional)</label><input id="phone" name="phone" type="tel" autocomplete="tel"></div></div>
<div class="fr"><div><label for="website">Website (optional)</label><input id="website" name="website" type="url" inputmode="url" placeholder="https://"></div>
<div><label for="location">Business location</label><input id="location" name="location" placeholder="City, State / Country" required><div class="err" id="location-err"></div></div></div>
<div class="fr"><div><label for="services">Services needed</label><select id="services" name="services"><option>New website</option><option>Website redesign</option><option>SEO foundations</option><option>Not sure yet</option></select></div>
<div><label for="budget">Budget</label><select id="budget" name="budget"><option>Not sure yet</option><option>$750–$1,500</option><option>$1,500–$2,500</option><option>$2,500+</option></select></div></div>
<div><label for="details">Project details</label><textarea id="details" name="details" rows="5" required></textarea><div class="err" id="details-err"></div></div>
<button class="btn" type="submit">Request a Project Review</button>
</form></div></section></main>
<footer><div class="wrap"><a class="logo" href="index.html">Vantorax Studio</a><div class="legal">© 2026 Vantorax Studio. All rights reserved.</div></div></footer>
</body>
